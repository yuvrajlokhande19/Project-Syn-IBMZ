<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IBM Z Command Center | Project Syn</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Share Tech Mono', monospace; background-color: #050505; color: #e0e0e0; overflow-x: hidden; }
        .glass-panel { background: rgba(15, 15, 20, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5); }
        .neon-border { border: 1px solid #00f3ff; box-shadow: 0 0 10px rgba(0, 243, 255, 0.2); }
        .neon-border-red { border: 1px solid #ff003c; box-shadow: 0 0 15px rgba(255, 0, 60, 0.4); animation: pulse-red 2s infinite; }
        @keyframes pulse-red { 0% { box-shadow: 0 0 10px rgba(255, 0, 60, 0.2); } 50% { box-shadow: 0 0 25px rgba(255, 0, 60, 0.6); } 100% { box-shadow: 0 0 10px rgba(255, 0, 60, 0.2); } }
        
        /* CRT Scanline Effect */
        .scanlines { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06)); background-size: 100% 4px, 3px 100%; pointer-events: none; z-index: 100; opacity: 0.4; }
        
        #map { height: 100%; width: 100%; filter: grayscale(100%) invert(100%) contrast(120%); }
        .ledger-feed::-webkit-scrollbar { width: 4px; }
        .ledger-feed::-webkit-scrollbar-thumb { background: #00f3ff; }
    </style>
</head>
<body class="h-screen w-screen flex flex-col p-4 gap-4 relative">
    <div class="scanlines"></div>

    <!-- HEADER -->
    <header class="glass-panel rounded-xl p-4 flex justify-between items-center z-10 neon-border">
        <div class="flex items-center gap-4">
            <div class="h-10 w-10 bg-[#00f3ff] rounded-full flex items-center justify-center text-black font-bold text-xl shadow-[0_0_15px_#00f3ff]">Z</div>
            <div>
                <h1 class="text-2xl font-bold tracking-widest text-white">PROJECT SYN <span class="text-[#00f3ff]">COMMAND CENTER</span></h1>
                <p class="text-xs text-gray-400">MAINFRAME ARCHITECTURE: s390x | BIG-ENDIAN SECURE</p>
            </div>
        </div>
        <div id="sys-status" class="px-6 py-2 rounded border border-[#00f3ff] text-[#00f3ff] flex items-center gap-2 bg-[#00f3ff]/10">
            <div class="h-3 w-3 rounded-full bg-[#00f3ff] animate-ping"></div>
            <span id="sys-status-text" class="font-bold tracking-wider">SYSTEM NOMINAL</span>
        </div>
    </header>

    <!-- MAIN GRID -->
    <main class="flex-1 grid grid-cols-12 gap-4 z-10 min-h-0">
        
        <!-- LEFT PANEL: MAP & CHARTS -->
        <div class="col-span-8 flex flex-col gap-4">
            
            <!-- Map Section -->
            <div class="glass-panel rounded-xl overflow-hidden relative flex-1 neon-border">
                <div id="map"></div>
                <div class="absolute top-4 right-4 glass-panel p-3 rounded border border-white/20 z-[400]">
                    <div class="text-xs text-[#00f3ff] mb-1 font-bold">IBM SNAP ML ANALYSIS</div>
                    <div class="flex justify-between gap-8 text-sm"><span class="text-gray-400">Grid Volt:</span> <span id="val-voltage" class="text-white font-bold">-- V</span></div>
                    <div class="flex justify-between gap-8 text-sm"><span class="text-gray-400">Flood Idx:</span> <span id="val-flood" class="text-white font-bold">--</span></div>
                    <div class="flex justify-between gap-8 text-sm"><span class="text-gray-400">Traffic:</span> <span id="val-congestion" class="text-white font-bold">--%</span></div>
                </div>
            </div>

            <!-- Live Chart Section -->
            <div class="glass-panel rounded-xl p-4 h-48 neon-border flex items-center justify-center relative">
                <canvas id="telemetryChart"></canvas>
            </div>
        </div>

        <!-- RIGHT PANEL: LEDGER & LOGS -->
        <div class="col-span-4 flex flex-col gap-4">
            
            <!-- CPACF Hash Ledger -->
            <div class="glass-panel rounded-xl p-4 flex-1 flex flex-col neon-border">
                <div class="flex justify-between items-end mb-2 border-b border-white/10 pb-2">
                    <h2 class="text-[#00f3ff] font-bold tracking-widest">CPACF HASH LEDGER</h2>
                    <span class="text-xs text-green-400 animate-pulse font-bold">● LIVE SYNC</span>
                </div>
                <p class="text-xs text-gray-500 mb-2">Chained SHA-256 HMAC Signatures</p>
                <div id="ledger-logs" class="ledger-feed flex-1 overflow-y-auto text-[10px] space-y-2 font-mono">
                    <!-- Logs injected here -->
                </div>
            </div>

            <!-- AI Alert Terminal -->
            <div class="glass-panel rounded-xl p-4 h-64 neon-border flex flex-col">
                <h2 class="text-[#00f3ff] font-bold tracking-widest border-b border-white/10 pb-2 mb-2">PHI-3 LOCAL LLM ALERTS</h2>
                <div id="llm-logs" class="flex-1 overflow-y-auto text-sm space-y-3 text-gray-300">
                    <div class="text-xs text-gray-500 blink">Waiting for Snap ML Anomaly Detection...</div>
                </div>
                <button id="attack-btn" class="mt-4 w-full py-2 bg-red-900/40 border border-red-500 text-red-500 hover:bg-red-900 hover:text-white transition-all rounded font-bold tracking-wider">
                    SIMULATE CYBER ATTACK
                </button>
            </div>
        </div>
    </main>

    <script>
        // --- MAPBOX / LEAFLET INIT ---
        const map = L.map('map', { zoomControl: false }).setView([21.1458, 79.0882], 13);
        L.tileLayer('https://basemaps.cartocdn.com/rastertiles/dark_all/{z}/{x}/{y}.png?key=cb1_3nqq_1_a586e19e0c11eefc021be78b', {
            attribution: '© CARTO'
        }).addTo(map);

        const markers = [];
        const locations = [
            { name: "GMC Nagpur", coords: [21.1284, 79.0991] },
            { name: "Mayo Hospital", coords: [21.1528, 79.1001] },
            { name: "AIIMS Nagpur", coords: [21.0560, 79.0435] }
        ];

        // Custom IBM Z Icon
        const sysIcon = L.divIcon({
            className: 'custom-div-icon',
            html: "<div class='h-4 w-4 bg-[#00f3ff] rounded-full shadow-[0_0_15px_#00f3ff]'></div>",
            iconSize: [16, 16],
            iconAnchor: [8, 8]
        });

        locations.forEach(loc => {
            const marker = L.marker(loc.coords, {icon: sysIcon}).addTo(map);
            marker.bindPopup(`<b class="text-black">${loc.name}</b>`);
            markers.push(marker);
        });

        // --- CHART.JS INIT ---
        const ctx = document.getElementById('telemetryChart').getContext('2d');
        const telemetryChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: Array(20).fill(''),
                datasets: [
                    { label: 'Flood Index (Scaled)', data: Array(20).fill(0), borderColor: '#00f3ff', borderWidth: 2, tension: 0.3, pointRadius: 0 },
                    { label: 'Grid Voltage (V)', data: Array(20).fill(220), borderColor: '#ff003c', borderWidth: 1, tension: 0.3, pointRadius: 0 }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: true, labels: { color: '#fff', font: {family: 'Share Tech Mono'} } } },
                scales: {
                    x: { display: false },
                    y: { grid: { color: 'rgba(255,255,255,0.1)' }, ticks: { color: '#aaa', font: {family: 'Share Tech Mono'} } }
                },
                animation: { duration: 0 } // instant for matrix feel
            }
        });

        // --- LIVE DATA FETCHING ---
        const ledger = document.getElementById('ledger-logs');
        const llmLogs = document.getElementById('llm-logs');
        let isAttacked = false;
        let lastHash = "";
        let lastAlertTime = "";

        setInterval(async () => {
            if (isAttacked) return;

            try {
                // Fetch through the local SSH Tunnel to bypass IBM Firewall
                const res = await fetch('http://127.0.0.1:8000/api/telemetry/live');
                const json = await res.json();
                
                if (json.live_stream && json.live_stream.length > 0) {
                    const latest = json.live_stream[0];
                    if(latest.hash === lastHash) return; // Only process new packets
                    lastHash = latest.hash;
                    const data = latest.data;
                    
                    // Update Ledger Hash
                    const entry = document.createElement('div');
                    entry.className = 'text-green-400 font-mono break-all bg-green-400/10 p-1 rounded border border-green-400/20';
                    entry.innerHTML = `<span class="text-white">TX:</span> ${latest.hash.substring(0,40)}...`;
                    ledger.appendChild(entry);
                    if(ledger.childElementCount > 15) ledger.removeChild(ledger.firstChild);
                    ledger.scrollTop = ledger.scrollHeight;
                    
                    // Update Stats
                    document.getElementById('val-voltage').innerText = data.metrics.grid_voltage.toFixed(1) + ' V';
                    document.getElementById('val-flood').innerText = data.metrics.flood_index.toFixed(2);
                    document.getElementById('val-congestion').innerText = data.metrics.route_congestion + '%';

                    // Update Chart
                    telemetryChart.data.datasets[0].data.shift();
                    telemetryChart.data.datasets[0].data.push(data.metrics.flood_index * 100); 
                    telemetryChart.data.datasets[1].data.shift();
                    telemetryChart.data.datasets[1].data.push(data.metrics.grid_voltage);
                    telemetryChart.update();

                    // Check for Real Backend Alerts
                    if (json.latest_alert && json.latest_alert.timestamp !== lastAlertTime) {
                        lastAlertTime = json.latest_alert.timestamp;
                        triggerAnomaly(json.latest_alert);
                    }
                }
            } catch (err) {
                // Silently wait for tunnel
            }
        }, 1500);

        function triggerAnomaly(alertData) {
            const time = new Date(alertData.timestamp).toLocaleTimeString();
            llmLogs.innerHTML = `
                <div class="text-red-400 border border-red-500/30 p-2 rounded bg-red-900/20 mb-2 shadow-[0_0_10px_#ff003c]">
                    <span class="font-bold tracking-widest">[${time}] SNAP ML DETECTED ANOMALY</span><br/>
                    <span class="text-white text-xs">Generating Trilingual Dispatch...</span>
                </div>
                <div class="text-xs text-gray-300 border-l-2 border-[#00f3ff] pl-2 space-y-1">
                    <pre class="font-mono whitespace-pre-wrap">${alertData.message}</pre>
                </div>
            `;
            
            document.querySelector('.neon-border').classList.add('neon-border-red');
            document.getElementById('sys-status-text').innerText = "ANOMALY DETECTED";
            document.getElementById('sys-status').className = "px-6 py-2 rounded border border-red-500 text-red-500 flex items-center gap-2 bg-red-500/10";
            document.getElementById('sys-status').firstElementChild.className = "h-3 w-3 rounded-full bg-red-500 animate-ping";
            
            setTimeout(() => {
                document.querySelector('.neon-border-red').classList.remove('neon-border-red');
                document.getElementById('sys-status-text').innerText = "SYSTEM NOMINAL";
                document.getElementById('sys-status').className = "px-6 py-2 rounded border border-[#00f3ff] text-[#00f3ff] flex items-center gap-2 bg-[#00f3ff]/10";
                document.getElementById('sys-status').firstElementChild.className = "h-3 w-3 rounded-full bg-[#00f3ff] animate-ping";
            }, 8000);
        }

        // Cyber Attack Simulation
        document.getElementById('attack-btn').addEventListener('click', () => {
            isAttacked = true;
            document.body.style.backgroundColor = "#2a0000";
            
            const panels = document.querySelectorAll('.glass-panel');
            panels.forEach(p => {
                p.classList.remove('neon-border');
                p.classList.add('neon-border-red');
            });

            document.getElementById('sys-status-text').innerText = "HMAC SIGNATURE BREACHED";
            document.getElementById('sys-status').className = "px-6 py-2 rounded border border-red-500 text-red-500 flex items-center gap-2 bg-red-500/20 shadow-[0_0_20px_#ff003c]";
            
            ledger.innerHTML = `<div class="text-red-500 font-bold text-xl text-center mt-10 animate-pulse">⚠️ CONNECTION SEVERED ⚠️<br/>INVALID BIG-ENDIAN HASH</div>`;
            
            setTimeout(() => {
                location.reload();
            }, 5000);
        });
    </script>
</body>
</html>
